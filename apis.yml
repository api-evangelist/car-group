name: CAR Group

description: CAR Group Limited (formerly carsales.com Limited, renamed 2023) is an ASX 50 company operating online vehicle marketplaces across Oceania, Asia and the Americas. It wholly owns carsales (Australia), Encar (South Korea), Trader Interactive (United States) and chileautos (Chile), and is majority shareholder of webmotors (Brazil), delivering technology and advertising solutions for buying and selling vehicles. Its corporate/investor site is cargroup.com.

